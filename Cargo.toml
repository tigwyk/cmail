[workspace]
resolver = "2"
members = [
    "crates/cmail-core",
    "crates/cmail-cli",
    "crates/cmail-mcp",
    "crates/cmail-relayd",
    "crates/cmail-relay-cf",
]

[workspace.package]
version = "0.3.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tigwyk/cmail"
edition = "2021"

[workspace.dependencies]
cmail-core = { path = "crates/cmail-core" }
cmail-mcp = { path = "crates/cmail-mcp" }
cmail-relayd = { path = "crates/cmail-relayd" }
cmail-relay-cf = { path = "crates/cmail-relay-cf" }
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "parsing"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
url = "2"
tiny_http = "0.12"
