[workspace]
resolver = "2"
members = ["crates/cmail-core", "crates/cmail-cli", "crates/cmail-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
cmail-core = { path = "crates/cmail-core" }
cmail-mcp = { path = "crates/cmail-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "parsing"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
