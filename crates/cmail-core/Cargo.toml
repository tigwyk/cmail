[package]
name = "cmail-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only in-memory signer; never enabled by release builds or the CLI.
test-authority = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
rand.workspace = true
sha2.workspace = true
hkdf.workspace = true
chacha20poly1305.workspace = true
hex.workspace = true
base64.workspace = true
thiserror.workspace = true
toml.workspace = true
time.workspace = true
ureq.workspace = true
url.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
pollster = "0.4"
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "Win32_Security_Credentials",
    "Win32_System_WinRT",
] }

[dev-dependencies]
tempfile.workspace = true
# Dev-only (legal Cargo cycle): in-process relay fixtures for the routed-send
# and fetch service tests. Server code never ships with core.
cmail-relayd = { path = "../cmail-relayd" }
